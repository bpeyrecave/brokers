name: Update FX data

on:
  schedule:
    # Three times a day (UTC). ECB reference rates are published once on
    # business days around 16:00 CET, so at least one of these picks up the
    # fresh rate; the others keep the news brief current.
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch USD/EUR exchange rate history
        run: node scripts/fetch-fx.mjs

      - name: Generate today's AI FX brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-brief.mjs

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update FX data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
